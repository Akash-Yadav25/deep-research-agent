[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-researcher"
version = "0.1.0"
description = "Hierarchical multi-agent deep research system using LangGraph and Ollama"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-ollama>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-aws>=0.2.0",
    "boto3>=1.34.0",
    "langchain-community>=0.3.0",
    "tavily-python>=0.5.0",
    "arxiv>=2.1.0",
    "pymupdf>=1.24.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["deep_researcher*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
deep-researcher = "deep_researcher.main:main"
